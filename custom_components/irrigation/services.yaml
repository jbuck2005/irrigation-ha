run:
  name: Run
  description: Run one or more zones, one at a time, through the run queue. Without a duration, each zone runs for its default run time. A zone that's already running is left as it is.
  target:
    entity:
      integration: irrigation
      domain: valve
  fields:
    duration:
      name: Duration
      description: Run time in seconds, from 10 to 7200. Leave out to use each zone's default run time.
      required: false
      example: 300
      selector:
        number:
          min: 10
          max: 7200
          step: 10
          unit_of_measurement: "s"
          mode: box
stop_all:
  name: Stop all
  description: Clear every controller's run queue and close all zones and master valves.
run_program:
  name: Run program
  description: Run a program now, whether or not its schedule is on. Its zones queue behind any zone already running.
  target:
    entity:
      integration: irrigation
      domain: switch
