run:
  name: Run
  description: Run zone valves for a custom duration. If no duration is specified, uses each zone's configured default duration.
  target:
    entity:
      integration: irrigation
      domain: valve
  fields:
    duration:
      description: Duration in seconds (optional - uses zone default if not specified)
      required: false
      example: 300
      selector:
        number:
          min: 10
          max: 7200
          step: 10
          unit_of_measurement: "s"
          mode: box
stop_all:
  name: Stop all
  description: Clear every controller's run queue and close all zones and master valves.
run_program:
  name: Run program
  description: Run a program now, whether or not its schedule is on. Its zones queue behind any zone already running.
  target:
    entity:
      integration: irrigation
      domain: switch
