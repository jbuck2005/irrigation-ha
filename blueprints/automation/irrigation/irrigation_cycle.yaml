blueprint:
  name: Irrigation Cycle
  description: >
    Run irrigation zones one after another, with a run time for each zone.
    Requires the Irrigation Controller integration (irrigation-ha).
  domain: automation
  input:
    start_time:
      name: Start Time
      description: When to run the irrigation cycle.
      selector:
        time: {}
    zones:
      name: Zones
      description: Zone valves to run in order. Pick each valve; areas and devices aren't supported.
      selector:
        target:
          entity:
            integration: irrigation
            domain: valve
    durations:
      name: Zone Durations (seconds)
      description: >
        Run times in seconds, separated by commas, in the same order as the zones.
        Example: 300,600,300. A zone without a run time runs for 300 seconds.
      default: ""
      selector:
        text: {}

trigger:
  - platform: time
    at: !input start_time

action:
  - variables:
      zone_entities: !input zones
      durations: !input durations
  - repeat:
      count: "{{ zone_entities.entity_id | count }}"
      sequence:
        - variables:
            current_zone: "{{ zone_entities.entity_id[repeat.index-1] }}"
            current_duration: >
              {% set d = durations.split(',') if durations else [] %}
              {% if d|length >= repeat.index %}
              {{ d[repeat.index-1] | int }}
              {% else %}
              300
              {% endif %}
        # A zone that fails must not cancel the zones after it
        - service: irrigation.run
          continue_on_error: true
          target:
            entity_id: "{{ current_zone }}"
          data:
            duration: "{{ current_duration }}"
        - delay:
            seconds: "{{ current_duration }}"
        - service: valve.close_valve
          continue_on_error: true
          target:
            entity_id: "{{ current_zone }}"
          data: {}

mode: single
