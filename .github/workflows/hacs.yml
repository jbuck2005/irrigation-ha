name: HACS Validation

on:
  push:
    branches:
      - main
  pull_request:

# The checks only read the repo.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit so an upstream change can't run here
      # until it's reviewed. Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-11-08

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-11-08
        with:
          category: integration
